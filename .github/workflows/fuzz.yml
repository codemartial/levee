name: Fuzz

# Native Go fuzzing runs weekly (and on demand) rather than on every PR: the
# numerical and admission paths are explored for a few minutes each, and any
# crasher is written under testdata/fuzz and fails the run.
on:
  schedule:
    - cron: "0 6 * * 0" # 06:00 UTC Sunday
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fuzz:
    name: fuzz ${{ matrix.target }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [FuzzAdmission, FuzzInvNormCDF, FuzzWilson]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          check-latest: true
      - name: Fuzz ${{ matrix.target }}
        run: go test -run '^$' -fuzz '^${{ matrix.target }}$' -fuzztime 3m .
      - name: Upload crashers
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: fuzz-corpus-${{ matrix.target }}
          path: testdata/fuzz
          if-no-files-found: ignore
